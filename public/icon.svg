<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin for maskable icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.15" />

  <!-- Safe Zone Graphic (within 80% circle, r <= 204) -->
  <g transform="translate(0, -6)">
    <!-- Stylized House Roof Silhouette -->
    <path d="M140 220 L256 126 L372 220" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Central Dumbbell Icon intersecting the home -->
    <!-- Left Weight Plate -->
    <rect x="156" y="270" width="28" height="96" rx="8" fill="url(#primaryGrad)" />
    <rect x="184" y="284" width="16" height="68" rx="5" fill="#34d399" />

    <!-- Center Handle Barbell -->
    <rect x="200" y="306" width="112" height="24" rx="6" fill="#f8fafc" />
    <!-- Grip textures -->
    <line x1="236" y1="310" x2="236" y2="326" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="310" x2="256" y2="326" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="276" y1="310" x2="276" y2="326" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Right Weight Plate -->
    <rect x="312" y="284" width="16" height="68" rx="5" fill="#34d399" />
    <rect x="328" y="270" width="28" height="96" rx="8" fill="url(#primaryGrad)" />

    <!-- Core Lightning / Energy Pulse Spark in upper house peak -->
    <path d="M256 166 L246 196 L266 196 L248 238 L268 206 L250 206 Z" fill="#6ee7b7" />
  </g>

  <!-- App name lettering in lower safe zone -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="3">FITHOME</text>
  <text x="256" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="1.5">TREINO EM CASA</text>
</svg>
